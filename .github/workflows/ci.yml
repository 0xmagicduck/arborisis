name: CI

# Voir plan/09-open-source-devops.md §9.3. Workflows e2e/docker-publish/deploy
# arrivent avec les Phases 2-6 (rien à builder/déployer avant).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: arborisis
          POSTGRES_PASSWORD: arborisis
          POSTGRES_DB: arborisis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arborisis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arborisis:arborisis@localhost:5432/arborisis
      REDIS_URL: redis://localhost:6379
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Arborisis
      WEBAUTHN_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ARCHIVE_TO_IA: "false"
    steps:
      - uses: actions/checkout@v4

      # Pas de "version:" ici — pnpm/action-setup@v4 lit déjà "packageManager"
      # dans package.json (pnpm@9.15.0) ; spécifier les deux fait échouer
      # l'action (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # apps/worker exerce le vrai binaire ffmpeg/ffprobe dans ses tests (voir
      # apps/worker/src/__tests__/audio.test.ts) plutôt que de le mocker —
      # c'est justement cette intégration que le pipeline "publish-recording"
      # (plan/05 §5.3) doit valider.
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate (schéma DB, voir packages/db)
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
