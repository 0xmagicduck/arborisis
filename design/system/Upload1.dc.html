<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FAFAF8; font-family: 'Public Sans', system-ui, sans-serif; }
    .serif { font-family: 'Source Serif 4', serif; }
  </style>
</helmet>

<div style="width:1280px; height:860px; background:#FAFAF8; color:#201E1B; display:flex; flex-direction:column;">

  <div style="padding:22px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(32,30,27,0.12);">
    <div style="font-size:13px; letter-spacing:0.18em; font-weight:500;">ARBORISIS</div>
    <div style="display:flex; align-items:center; gap:32px;">
      <span style="font-size:12px; color:#8D8A85;">Explorer</span>
      <span style="font-size:12px; color:#8D8A85;">Découvrir</span>
      <span style="font-size:12px; color:#201E1B; font-weight:500;">Ajouter</span>
      <span style="font-size:12px; color:#8D8A85;">Recherche</span>
    </div>
    <div style="width:26px; height:26px; border-radius:50%; border:1px solid #201E1B; display:flex; align-items:center; justify-content:center;"><span style="font-size:10px;">B</span></div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; padding:56px 40px 40px 40px;">

    <div style="width:100%; max-width:480px;">
      <!-- step indicator -->
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:56px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; background:#201E1B; color:#FAFAF8; font-size:10px; display:flex; align-items:center; justify-content:center;">1</div>
          <span style="font-size:12px; font-weight:500;">Sound</span>
        </div>
        <div style="flex:1; height:1px; background:rgba(32,30,27,0.18); margin:0 6px;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; border:1px solid #B8B5AF; color:#B8B5AF; font-size:10px; display:flex; align-items:center; justify-content:center;">2</div>
          <span style="font-size:12px; color:#B8B5AF;">Place &amp; details</span>
        </div>
        <div style="flex:1; height:1px; background:rgba(32,30,27,0.18); margin:0 6px;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; border:1px solid #B8B5AF; color:#B8B5AF; font-size:10px; display:flex; align-items:center; justify-content:center;">3</div>
          <span style="font-size:12px; color:#B8B5AF;">Publish</span>
        </div>
      </div>

      <div class="serif" style="font-style:italic; font-size:24px; margin-bottom:8px;">Add a field recording</div>
      <div style="font-size:13px; color:#5C5A55; margin-bottom:40px;">Start with the sound. You can add the place and details next.</div>

      <div style="border:1px solid rgba(32,30,27,0.3); padding:64px 32px; display:flex; flex-direction:column; align-items:center; gap:18px;">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <path d="M14,4 L14,20 M7,11 L14,4 L21,11" fill="none" stroke="#33513E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4,24 L24,24" stroke="#201E1B" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <div style="font-size:15px; font-weight:500;">Drop your recording here</div>
        <div style="font-size:12px; color:#8D8A85;">WAV, FLAC or MP3</div>
        <div style="border:1px solid #201E1B; padding:9px 22px; font-size:12px; font-weight:500; margin-top:8px;">Browse files</div>
      </div>

      <div style="font-size:11.5px; color:#8D8A85; margin-top:20px; text-align:center;">Files stay private until you publish in step 3.</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
