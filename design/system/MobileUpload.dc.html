<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FAFAF8; font-family: 'Public Sans', system-ui, sans-serif; }
    .serif { font-family: 'Source Serif 4', serif; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#FAFAF8; color:#201E1B; display:flex; flex-direction:column;">

  <div style="padding:18px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(32,30,27,0.12);">
    <span style="font-size:13px; color:#8D8A85;">←</span>
    <div style="font-size:12px; letter-spacing:0.16em; font-weight:500;">ARBORISIS</div>
    <span style="font-size:13px; color:transparent;">←</span>
  </div>

  <div style="flex:1; padding:28px 22px;">

    <!-- step indicator -->
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:40px;">
      <div style="width:16px; height:16px; border-radius:50%; background:#201E1B; color:#FAFAF8; font-size:9px; display:flex; align-items:center; justify-content:center;">1</div>
      <div style="flex:1; height:1px; background:rgba(32,30,27,0.18);"></div>
      <div style="width:16px; height:16px; border-radius:50%; border:1px solid #B8B5AF; color:#B8B5AF; font-size:9px; display:flex; align-items:center; justify-content:center;">2</div>
      <div style="flex:1; height:1px; background:rgba(32,30,27,0.18);"></div>
      <div style="width:16px; height:16px; border-radius:50%; border:1px solid #B8B5AF; color:#B8B5AF; font-size:9px; display:flex; align-items:center; justify-content:center;">3</div>
    </div>
    <div style="display:flex; justify-content:space-between; margin:-32px 0 40px 0; font-size:9.5px; color:#8D8A85;">
      <span style="color:#201E1B; font-weight:500;">Sound</span>
      <span>Place &amp; details</span>
      <span>Publish</span>
    </div>

    <div class="serif" style="font-style:italic; font-size:21px; margin-bottom:8px;">Add a field recording</div>
    <div style="font-size:12.5px; color:#5C5A55; margin-bottom:36px; line-height:1.55;">Start with the sound. You can add the place and details next.</div>

    <div style="border:1px solid rgba(32,30,27,0.3); padding:44px 20px; display:flex; flex-direction:column; align-items:center; gap:16px;">
      <svg width="26" height="26" viewBox="0 0 28 28">
        <path d="M14,4 L14,20 M7,11 L14,4 L21,11" fill="none" stroke="#33513E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4,24 L24,24" stroke="#201E1B" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div style="font-size:14px; font-weight:500; text-align:center;">Tap to select a recording</div>
      <div style="font-size:11.5px; color:#8D8A85;">WAV, FLAC or MP3</div>
    </div>

    <div style="font-size:11px; color:#8D8A85; margin-top:20px; text-align:center;">Files stay private until you publish in step 3.</div>
  </div>

  <div style="padding:18px 22px 28px 22px; border-top:1px solid rgba(32,30,27,0.12);">
    <div style="background:#201E1B; color:#FAFAF8; font-size:13px; font-weight:500; text-align:center; padding:14px; opacity:0.35;">Continue</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
