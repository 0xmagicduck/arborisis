<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FAFAF8; font-family: 'Public Sans', system-ui, sans-serif; }
    .serif { font-family: 'Source Serif 4', serif; }
    .field-label { font-size:11px; color:#8D8A85; margin-bottom:8px; display:block; }
    .field { border:none; border-bottom:1px solid rgba(32,30,27,0.35); background:transparent; font-family:'Public Sans', sans-serif; font-size:14px; color:#201E1B; padding:0 0 8px 0; width:100%; }
  </style>
</helmet>

<div style="width:1280px; height:860px; background:#FAFAF8; color:#201E1B; display:flex; flex-direction:column;">

  <div style="padding:22px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(32,30,27,0.12);">
    <div style="font-size:13px; letter-spacing:0.18em; font-weight:500;">ARBORISIS</div>
    <div style="display:flex; align-items:center; gap:32px;">
      <span style="font-size:12px; color:#8D8A85;">Explorer</span>
      <span style="font-size:12px; color:#8D8A85;">Découvrir</span>
      <span style="font-size:12px; color:#201E1B; font-weight:500;">Ajouter</span>
      <span style="font-size:12px; color:#8D8A85;">Recherche</span>
    </div>
    <div style="width:26px; height:26px; border-radius:50%; border:1px solid #201E1B; display:flex; align-items:center; justify-content:center;"><span style="font-size:10px;">B</span></div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; padding:56px 40px 40px 40px;">

    <div style="width:100%; max-width:560px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:56px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; border:1px solid #201E1B; color:#201E1B; font-size:10px; display:flex; align-items:center; justify-content:center;">✓</div>
          <span style="font-size:12px; color:#5C5A55;">Sound</span>
        </div>
        <div style="flex:1; height:1px; background:rgba(32,30,27,0.18); margin:0 6px;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; background:#201E1B; color:#FAFAF8; font-size:10px; display:flex; align-items:center; justify-content:center;">2</div>
          <span style="font-size:12px; font-weight:500;">Place &amp; details</span>
        </div>
        <div style="flex:1; height:1px; background:rgba(32,30,27,0.18); margin:0 6px;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:18px; height:18px; border-radius:50%; border:1px solid #B8B5AF; color:#B8B5AF; font-size:10px; display:flex; align-items:center; justify-content:center;">3</div>
          <span style="font-size:12px; color:#B8B5AF;">Publish</span>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px; margin-bottom:40px; padding-bottom:24px; border-bottom:1px solid rgba(32,30,27,0.12);">
        <div style="width:30px; height:30px; border-radius:50%; border:1px solid #33513E; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="8" height="10" viewBox="0 0 10 12"><path d="M0,0 L10,6 L0,12 Z" fill="#33513E"/></svg></div>
        <div>
          <div style="font-size:13px; font-weight:500;">rainfall_sonian_16aug.wav</div>
          <div style="font-size:11px; color:#8D8A85;">6:42 — 48 kHz / 24-bit</div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:28px;">
        <div>
          <label class="field-label">Title</label>
          <input class="field" value="Forest after rainfall" />
        </div>
        <div>
          <label class="field-label">Location</label>
          <input class="field" value="Sonian Forest, Belgium" />
        </div>
        <div>
          <label class="field-label">Description</label>
          <textarea class="field" rows="2" style="resize:none; font-family:'Public Sans', sans-serif;">Light rainfall fading into distant birds and leaves moving above the trail.</textarea>
        </div>
        <div>
          <label class="field-label">Tags — separated by commas</label>
          <input class="field" value="forest, rain, birds" />
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:48px;">
        <div style="font-size:12px; color:#8D8A85;">← Back</div>
        <div style="background:#201E1B; color:#FAFAF8; font-size:12px; font-weight:500; padding:10px 24px;">Continue</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
