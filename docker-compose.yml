# Dépendances de développement local uniquement (PostgreSQL/PostGIS, Redis,
# Meilisearch, MinIO) — voir plan/09-open-source-devops.md §9.5 ("comment
# lancer le projet en local ... sans dépendre d'un vrai compte Internet
# Archive en dev"). MinIO joue ici le même rôle pour l'Object Storage : API
# S3-compatible, remplace l'Object Storage Infomaniak en local (voir
# plan/05-stockage-audio-internet-archive.md §5.10).
#
# `infra/docker-compose.yml` est un fichier différent : c'est celui qui tourne
# en production sur la VM Infomaniak (Caddy, voir plan/04-infra-infomaniak.md).
#
# apps/web, apps/api, apps/worker tournent en dehors de Docker en dev
# (`pnpm dev` à la racine, via Turborepo) — pas encore conteneurisés ici, voir
# plan/TASKS.md Phase 1.

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arborisis
      POSTGRES_PASSWORD: arborisis
      POSTGRES_DB: arborisis
    ports:
      - "5432:5432"
    volumes:
      - arborisis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arborisis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: dev-only-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - arborisis_meili_data:/meili_data

  # Object Storage S3-compatible pour le dev local — voir plan/05 §5.10 et
  # .env.example (OBJECT_STORAGE_*). Credentials arbitraires, dev uniquement.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arborisis-dev
      MINIO_ROOT_PASSWORD: arborisis-dev-secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - arborisis_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Conteneur one-shot : crée le bucket au démarrage puis s'arrête (pas de
  # `MINIO_DEFAULT_BUCKETS` natif côté MinIO, voir doc officielle).
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 arborisis-dev arborisis-dev-secret &&
      mc mb -p local/arborisis-storage &&
      exit 0
      "

volumes:
  arborisis_postgres_data:
  arborisis_meili_data:
  arborisis_minio_data:
